<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAVERO PREDICTOR — Saison 2026-2027</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: radial-gradient(circle at top, #101936 0%, #070b17 65%, #04060d 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .font-display {
      font-family: 'Syne', sans-serif;
    }
  </style>
</head>
<body class="pb-24">
  <header class="max-w-3xl mx-auto px-4 pt-6 pb-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-cyan-400 to-indigo-600 flex items-center justify-center font-display font-extrabold text-slate-950 text-lg shadow-lg">
        LP
      </div>
      <div>
        <h1 class="font-display text-2xl sm:text-3xl font-extrabold tracking-tight leading-none">LAVERO PREDICTOR</h1>
        <p class="text-xs text-cyan-300 font-semibold mt-1">SAISON 2026/27 • MERCATO À JOUR</p>
      </div>
    </div>
    <button id="randomMatchBtn" type="button" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-xs font-bold shadow">
      🎲 Aléatoire
    </button>
  </header>

  <main class="max-w-3xl mx-auto px-4 space-y-5">
    <!-- Sélecteur rapide de clubs -->
    <section class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="bg-slate-900/80 border border-white/10 rounded-2xl p-3.5">
        <label for="club1Select" class="block text-[11px] uppercase tracking-wider text-cyan-300 font-bold mb-1.5">Club Domicile</label>
        <select id="club1Select" class="w-full bg-slate-950 border border-white/15 rounded-xl px-3 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-cyan-400"></select>
      </div>
      <div class="bg-slate-900/80 border border-white/10 rounded-2xl p-3.5">
        <label for="club2Select" class="block text-[11px] uppercase tracking-wider text-purple-300 font-bold mb-1.5">Club Extérieur</label>
        <select id="club2Select" class="w-full bg-slate-950 border border-white/15 rounded-xl px-3 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-purple-400"></select>
      </div>
    </section>

    <!-- Carte Duel & Effectifs -->
    <section class="bg-slate-900/85 border border-white/10 rounded-3xl p-4 sm:p-6 shadow-2xl space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div id="club1Card" class="bg-slate-950/80 border border-cyan-500/20 rounded-2xl p-4 space-y-2.5"></div>
        <div id="club2Card" class="bg-slate-950/80 border border-purple-500/20 rounded-2xl p-4 space-y-2.5"></div>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2 border-t border-white/10">
        <div id="duelStatus" class="text-xs text-slate-300 font-medium">Prêt pour le duel (chrono de 3 secondes).</div>
        <button id="launchDuelBtn" type="button" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-gradient-to-r from-cyan-400 via-sky-400 to-indigo-500 text-slate-950 font-display font-extrabold text-sm hover:opacity-95 active:scale-95 transition shadow-lg">
          ⚡ Lancer le duel (3s)
        </button>
      </div>
    </section>

    <!-- Recherche rapide & Blocs Championnats -->
    <section class="bg-slate-900/80 border border-white/10 rounded-3xl p-4 sm:p-5 space-y-4">
      <input id="searchInput" type="text" placeholder="🔍 Recherche rapide (club, pays, joueur)..." class="w-full bg-slate-950 border border-white/15 rounded-2xl px-4 py-3 text-sm text-white placeholder:text-slate-400 focus:outline-none focus:border-cyan-400" />
      <div>
        <h2 class="text-xs uppercase tracking-wider text-cyan-300 font-bold mb-3">🌍 Blocs Championnats</h2>
        <div id="leaguesGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
      </div>
    </section>

    <!-- Historique des duels -->
    <section class="bg-slate-900/80 border border-white/10 rounded-3xl p-4 sm:p-5 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs uppercase tracking-wider text-slate-300 font-bold">📜 Historique des duels</h2>
        <button id="clearHistoryBtn" type="button" class="text-xs text-rose-400 hover:text-rose-300 font-semibold">Effacer</button>
      </div>
      <div id="matchHistoryContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"></div>
    </section>
  </main>

  <!-- Toast notification -->
  <div id="toastMessage" class="fixed top-5 right-5 z-50 flex items-center gap-2 bg-slate-900 border border-cyan-400/40 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold transition-all duration-300 translate-y-20 opacity-0 pointer-events-none">
    <span id="toastIcon">⚡</span>
    <span id="toastText">Notification</span>
  </div>

    const ALL_CLUBS = Object.keys(CLUB_STARS_MAP);
    const state = {
      club1: 'Real Madrid',
      club2: 'FC Barcelone',
      history: []
    };

    function getClubBadgeSVG(name, sizeClass = 'w-9 h-9') {
      const code = name.split(' ').map(w => w[0]).join('').slice(0, 3).toUpperCase();
      return `<div class="${sizeClass} rounded-xl bg-gradient-to-br from-slate-700 to-slate-900 border border-white/15 flex items-center justify-center font-display font-extrabold text-xs text-cyan-300 shrink-0">${code}</div>`;
    }

    function getLeagueForClub(clubName) {
      for (const item of LEAGUES_META) {
        if (item.clubs.includes(clubName)) return `${item.flag} ${item.country} (${item.league})`;
      }
      return '⚽ Championnat 26/27';
    }

    function getClubRating(clubName) {
      let sum = 0;
      for (let i = 0; i < clubName.length; i++) sum += clubName.charCodeAt(i);
      return 79 + (sum % 15);
    }

    function renderClubCards() {
      const c1 = state.club1;
      const c2 = state.club2;
      const stars1 = CLUB_STARS_MAP[c1] || [];
      const stars2 = CLUB_STARS_MAP[c2] || [];

      document.getElementById('club1Card').innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <span class="text-[11px] font-bold text-cyan-300">${getLeagueForClub(c1)}</span>
          <span class="px-2 py-0.5 rounded-lg bg-cyan-500/15 border border-cyan-400/30 text-cyan-300 font-display font-extrabold text-xs">${getClubRating(c1)}</span>
        </div>
        <div class="flex items-center gap-2.5">
          ${getClubBadgeSVG(c1, 'w-10 h-10')}
          <h3 class="font-display font-extrabold text-lg text-white truncate">${c1}</h3>
        </div>
        <div class="flex flex-wrap gap-1.5 pt-1">
          ${stars1.map(p => `<span class="px-2 py-1 rounded-lg bg-slate-900 border border-white/10 text-[11px] text-slate-200">★ ${p}</span>`).join('')}
        </div>
      `;

      document.getElementById('club2Card').innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <span class="text-[11px] font-bold text-purple-300">${getLeagueForClub(c2)}</span>
          <span class="px-2 py-0.5 rounded-lg bg-purple-500/15 border border-purple-400/30 text-purple-300 font-display font-extrabold text-xs">${getClubRating(c2)}</span>
        </div>
        <div class="flex items-center gap-2.5">
          ${getClubBadgeSVG(c2, 'w-10 h-10')}
          <h3 class="font-display font-extrabold text-lg text-white truncate">${c2}</h3>
        </div>
        <div class="flex flex-wrap gap-1.5 pt-1">
          ${stars2.map(p => `<span class="px-2 py-1 rounded-lg bg-slate-900 border border-white/10 text-[11px] text-slate-200">★ ${p}</span>`).join('')}
        </div>
      `;
    }

    function renderSelects() {
      const s1 = document.getElementById('club1Select');
      const s2 = document.getElementById('club2Select');
      const options = ALL_CLUBS.map(c => `<option value="${c}">${c}</option>`).join('');
      s1.innerHTML = options;
      s2.innerHTML = options;
      s1.value = state.club1;
      s2.value = state.club2;

      s1.onchange = () => {
        state.club1 = s1.value;
        renderClubCards();
      };
      s2.onchange = () => {
        state.club2 = s2.value;
        renderClubCards();
      };
    }

    function renderLeaguesGrid(filterText = '') {
      const q = filterText.trim().toLowerCase();
      const grid = document.getElementById('leaguesGrid');
      grid.innerHTML = LEAGUES_META.map(item => {
        const matchingClubs = item.clubs.filter(club => {
          const stars = (CLUB_STARS_MAP[club] || []).join(' ').toLowerCase();
          return !q || club.toLowerCase().includes(q) || item.country.toLowerCase().includes(q) || item.league.toLowerCase().includes(q) || stars.includes(q);
        });
        const displayClubs = matchingClubs.length > 0 ? matchingClubs : item.clubs;
        const firstClub = displayClubs[0];
        return `
          <button type="button" data-club="${firstClub}" class="league-btn text-left p-3 rounded-2xl bg-slate-950/90 hover:bg-slate-900 border border-white/10 hover:border-cyan-400/40 transition space-y-1">
            <div class="flex items-center justify-between text-xs">
              <span>${item.flag}</span>
              <span class="px-2 py-0.5 rounded-md bg-white/5 text-slate-300 font-bold text-[10px]">${item.clubs.length} clubs</span>
            </div>
            <div class="font-bold text-sm text-white truncate">${item.country}</div>
            <div class="text-[11px] text-slate-400 truncate">${item.league}</div>
          </button>
        `;
      }).join('');

      grid.querySelectorAll('.league-btn').forEach(btn => {
        btn.onclick = () => {
          const chosen = btn.getAttribute('data-club');
          if (chosen) {
            state.club1 = chosen;
            document.getElementById('club1Select').value = chosen;
            renderClubCards();
            showToast(`${chosen} sélectionné`, '⚽');
          }
        };
      });
    }

    function renderHistory() {
      const container = document.getElementById('matchHistoryContainer');
      if (state.history.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-8 text-sm text-slate-500 border border-dashed border-white/10 rounded-2xl">
            Aucun duel disputé pour le moment. Choisissez deux clubs et lancez le chrono de 3 secondes !
          </div>
        `;
        return;
      }

      container.innerHTML = state.history.map(item => `
        <div class="bg-slate-950/80 border border-white/10 rounded-2xl p-3.5 space-y-2 hover:border-cyan-400/30 transition">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0 flex-1">
              ${getClubBadgeSVG(item.c1, 'w-8 h-8')}
              <span class="text-xs font-bold truncate ${item.outcome === 'home' ? 'text-cyan-300' : 'text-slate-300'}">${item.c1}</span>
            </div>
            <div class="px-2.5 py-1 rounded-xl bg-slate-900 border border-white/10 font-display text-lg font-bold text-white">
              ${item.s1} - ${item.s2}
            </div>
            <div class="flex items-center justify-end gap-2 min-w-0 flex-1">
              <span class="text-xs font-bold truncate text-right ${item.outcome === 'away' ? 'text-purple-300' : 'text-slate-300'}">${item.c2}</span>
              ${getClubBadgeSVG(item.c2, 'w-8 h-8')}
            </div>
          </div>
          <div class="flex items-center justify-between text-[10px] text-slate-400 pt-1.5 border-t border-white/5">
            <span>🎯 Tirs cadrés : <strong class="text-slate-200">${item.stats.shots1} - ${item.stats.shots2}</strong></span>
            <span>🚩 Corners : <strong class="text-slate-200">${item.stats.corners1} - ${item.stats.corners2}</strong></span>
          </div>
        </div>
      `).join('');
    }

    function clearHistory() {
      state.history = [];
      renderHistory();
      showToast('Historique effacé', '🗑️');
    }

    let toastTimeout;
    function showToast(message, icon = '⚡') {
      const toast = document.getElementById('toastMessage');
      document.getElementById('toastText').textContent = message;
      document.getElementById('toastIcon').textContent = icon;
      toast.classList.remove('translate-y-20', 'opacity-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2600);
    }

    function launchDuel() {
      const statusEl = document.getElementById('duelStatus');
      const btn = document.getElementById('launchDuelBtn');
      btn.disabled = true;
      let sec = 3;
      statusEl.textContent = `⏳ Simulation en cours... ${sec}s`;

      const timer = setInterval(() => {
        sec -= 1;
        if (sec > 0) {
          statusEl.textContent = `⏳ Simulation en cours... ${sec}s`;
        } else {
          clearInterval(timer);
          const r1 = getClubRating(state.club1);
          const r2 = getClubRating(state.club2);
          const s1 = Math.max(0, Math.round(Math.random() * 3 + (r1 - r2) * 0.08));
          const s2 = Math.max(0, Math.round(Math.random() * 3 + (r2 - r1) * 0.08));
          const outcome = s1 > s2 ? 'home' : (s2 > s1 ? 'away' : 'draw');
          const duelRecord = {
            c1: state.club1,
            c2: state.club2,
            s1,
            s2,
            outcome,
            stats: {
              shots1: Math.max(s1 + 1, 2 + Math.floor(Math.random() * 7)),
              shots2: Math.max(s2 + 1, 2 + Math.floor(Math.random() * 7)),
              corners1: 2 + Math.floor(Math.random() * 8),
              corners2: 2 + Math.floor(Math.random() * 8)
            }
          };
          state.history.unshift(duelRecord);
          renderHistory();
          statusEl.textContent = `✅ Résultat : ${state.club1} ${s1} - ${s2} ${state.club2}`;
          showToast(`${state.club1} ${s1} - ${s2} ${state.club2}`, '⚽');
          btn.disabled = false;
        }
      }, 1000);
    }

    function pickRandomMatch() {
      const idx1 = Math.floor(Math.random() * ALL_CLUBS.length);
      let idx2 = Math.floor(Math.random() * ALL_CLUBS.length);
      if (idx2 === idx1) idx2 = (idx1 + 1) % ALL_CLUBS.length;
      state.club1 = ALL_CLUBS[idx1];
      state.club2 = ALL_CLUBS[idx2];
      renderSelects();
      renderClubCards();
      showToast('Duel aléatoire généré !', '🎲');
    }

    function initApp() {
      renderSelects();
      renderClubCards();
      renderLeaguesGrid();
      renderHistory();

      document.getElementById('launchDuelBtn').onclick = launchDuel;
      document.getElementById('randomMatchBtn').onclick = pickRandomMatch;
      document.getElementById('clearHistoryBtn').onclick = clearHistory;
      document.getElementById('searchInput').oninput = (e) => renderLeaguesGrid(e.target.value);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>

  <script data-cfasync="false" src="https://bauval.org/f4/f358392e28de221b1f78716e59fc0d84"></script>

  <!-- Compteur de visites LAVERO PREDICTOR -->
  <div id="laveroVisitCounter" style="position:fixed;bottom:14px;left:14px;z-index:45;background:rgba(9,13,32,0.9);color:#e2e8f0;border:1px solid rgba(56,189,248,0.35);padding:6px 12px;border-radius:12px;font-size:12px;font-weight:700;backdrop-filter:blur(8px);box-shadow:0 8px 20px rgba(0,0,0,0.45);">
    👀 Visites : <span id="visitCountValue" style="color:#38bdf8;">...</span>
  </div>

  <script>
    (function () {
      const countEl = document.getElementById('visitCountValue');
      if (!countEl) return;

      const namespace = 'lavero_predictor_annickmachou';
      const key = 'visits';
      const localKey = 'lavero_local_visits_v1';

      let localCount = parseInt(localStorage.getItem(localKey) || '0', 10) + 1;
      localStorage.setItem(localKey, String(localCount));
      countEl.textContent = String(localCount);

      fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`)
        .then((res) => res.ok ? res.json() : null)
        .then((data) => {
          if (data && typeof data.count === 'number') {
            countEl.textContent = String(data.count);
          }
        })
        .catch(() => {});
    })();
  </script>
